name: Build APK

# Workflow riêng chỉ build file APK (nhanh, chạy trên Linux, không tốn phút macOS).
# Dùng: tab Actions -> "Build APK" -> Run workflow -> chọn nhánh, đặt tên phiên bản.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Tên phiên bản (ví dụ 1.2). Mã phiên bản tự tăng theo số lần chạy."
        default: "1.0"
        required: true
        type: string
      publish:
        description: "Đăng file lên mục Releases (tag apk-<phiên bản>-<số lần chạy>)"
        default: false
        type: boolean

jobs:
  apk:
    name: Build APK (Android)
    runs-on: ubuntu-latest
    permissions:
      contents: write          # chỉ cần khi bật "publish"
    steps:
      - name: Lấy source code
        uses: actions/checkout@v4

      - name: Đồng bộ JS dùng chung từ bản iOS
        run: python3 tools/sync_js.py

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK (ký bằng khóa debug, cài được ngay)
        working-directory: android
        run: >
          gradle --no-daemon assembleDebug
          -PverName="${{ inputs.version_name }}"
          -PverCode="${{ github.run_number }}"

      - name: Đặt tên file
        id: name
        run: |
          out="HKnow-${{ inputs.version_name }}-${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Upload file apk
        uses: actions/upload-artifact@v4
        with:
          name: HKnow-apk-${{ inputs.version_name }}
          path: ${{ steps.name.outputs.file }}

      - name: Đăng lên Releases
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ inputs.version_name }}-${{ github.run_number }}
          name: HKnow ${{ inputs.version_name }} (APK)
          prerelease: true
          files: ${{ steps.name.outputs.file }}
