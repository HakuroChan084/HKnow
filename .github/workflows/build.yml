name: Build IPA

on:
  workflow_dispatch:   # cho phép bấm nút "Run workflow" thủ công
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Lấy source code
        uses: actions/checkout@v4

      - name: Cài XcodeGen
        run: brew install xcodegen

      - name: Tạo file .xcodeproj
        run: xcodegen generate

      - name: Build (không ký)
        run: |
          xcodebuild \
            -project GFNWeb.xcodeproj \
            -scheme GFNWeb \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Đóng gói thành .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GFNWeb.app Payload/
          zip -r GFNWeb.ipa Payload

      - name: Upload file ipa
        uses: actions/upload-artifact@v4
        with:
          name: GFNWeb-ipa
          path: GFNWeb.ipa
