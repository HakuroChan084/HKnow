name: Build IPA + APK

on:
  workflow_dispatch:   # cho phép bấm nút "Run workflow" thủ công
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Lấy source code
        uses: actions/checkout@v4

      - name: Cài XcodeGen
        run: brew install xcodegen

      - name: Tạo file .xcodeproj
        run: xcodegen generate

      - name: Build (không ký)
        run: |
          xcodebuild \
            -project GFNWeb.xcodeproj \
            -scheme GFNWeb \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Đóng gói thành .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GFNWeb.app Payload/
          zip -r GFNWeb.ipa Payload

      - name: Upload file ipa
        uses: actions/upload-artifact@v4
        with:
          name: GFNWeb-ipa
          path: GFNWeb.ipa

  # ===== Bản Android (APK) – chạy song song với bản iOS, dùng chung đoạn JS tay cầm ảo =====
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy source code
        uses: actions/checkout@v4

      - name: Đồng bộ JS dùng chung từ bản iOS
        run: python3 tools/sync_js.py

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK (ký bằng khóa debug, cài thẳng được)
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload file apk
        uses: actions/upload-artifact@v4
        with:
          name: HKnow-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
