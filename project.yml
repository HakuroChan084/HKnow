name: GFNWeb
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"   # 1 = iPhone, 2 = iPad

targets:
  GFNWeb:
    type: application
    platform: iOS
    sources:
      - GFNWeb
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.gfnweb
        PRODUCT_NAME: GFNWeb
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GFNWeb/Info.plist
