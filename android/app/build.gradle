plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.hknow'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.hknow'
        minSdk 24
        targetSdk 34
        // Workflow Build APK truyền -PverCode=... -PverName=... để mỗi lần build ra một phiên bản khác
        versionCode = Integer.parseInt((project.findProperty('verCode') ?: '1').toString())
        versionName = (project.findProperty('verName') ?: '1.0').toString()
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
