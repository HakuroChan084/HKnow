plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.hknow'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.hknow'
        minSdk 24
        targetSdk 34
        // Workflow Build APK truyền -PverCode=... -PverName=... để mỗi lần build ra một phiên bản khác
        versionCode (project.findProperty('verCode') ?: '1').toInteger()
        versionName (project.findProperty('verName') ?: '1.0')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
